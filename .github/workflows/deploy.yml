name: Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and restart on EC2
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_USER: ${{ vars.EC2_SSH_USER }}
          EC2_APP_PATH: ${{ vars.EC2_APP_PATH }}
          EC2_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          : "${EC2_HOST:?Set the EC2_HOST repository variable}"
          : "${EC2_SSH_USER:?Set the EC2_SSH_USER repository variable}"
          : "${EC2_APP_PATH:?Set the EC2_APP_PATH repository variable}"
          : "${EC2_KNOWN_HOSTS:?Set the EC2_KNOWN_HOSTS repository variable}"
          : "${EC2_SSH_PRIVATE_KEY:?Set the EC2_SSH_PRIVATE_KEY repository secret}"

          key_path="$RUNNER_TEMP/ec2_deploy_key"
          known_hosts_path="$RUNNER_TEMP/ec2_known_hosts"
          trap 'rm -f "$key_path" "$known_hosts_path"' EXIT

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$key_path"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$known_hosts_path"
          chmod 600 "$key_path" "$known_hosts_path"

          remote_command="cd -- $(printf '%q' "$EC2_APP_PATH") && git pull --ff-only && npm ci && npm run build:backend && pm2 startOrRestart ecosystem.config.cjs --only 'ai-detective-backend' --update-env"
          # EC2_HOST may be an IP; use the DNS name in EC2_KNOWN_HOSTS for host-key verification.
          ssh \
            -i "$key_path" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=generative-watson.52-73-173-173.sslip.io \
            -o UserKnownHostsFile="$known_hosts_path" \
            "$EC2_SSH_USER@$EC2_HOST" \
            "$remote_command"
